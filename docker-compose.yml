name: wayplan-simulator

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: wayplan-simulator/backend
    env_file:
      - path: backend/.env
        required: false
    environment:
      PORT: 4000
      DATABASE_URL: file:/data/wayplan.db
    volumes:
      - backend-data:/data
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-4000}:4000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Запросы к API идут из браузера. На сервере адрес задаётся в .env рядом с этим файлом.
        API_URL: ${API_URL:-http://localhost:4000}
    image: wayplan-simulator/frontend
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
